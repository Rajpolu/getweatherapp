<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyline — Live Weather</title>
<meta name="description" content="Live weather, hourly and 14-day forecasts, air quality, and smart alerts for any city, area, or postal code.">
<meta name="theme-color" content="#8B7CF6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Skyline">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-48.png" sizes="48x48" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-lockup">
      <svg width="38" height="38" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logoGrad" x1="4" y1="6" x2="44" y2="42" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8B7CF6"/>
            <stop offset="0.5" stop-color="#60A5FA"/>
            <stop offset="1" stop-color="#F2B84B"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="22" fill="url(#logoGrad)"/>
        <path d="M16 27a6 6 0 0 1 1.2-11.9A8 8 0 0 1 32.6 18.4 6.5 6.5 0 0 1 31.5 31H17a5 5 0 0 1-1-4z" fill="white" fill-opacity="0.95"/>
        <path d="M18 33l-1.4 2.6M24 33.5l-1.4 2.6M30 33l-1.4 2.6" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="brand-name">Skyline</div>
        <div class="brand-sub">Live forecast, anywhere</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="icon-btn ghost bell-btn-sm" id="installBtn" title="Install Skyline" style="display:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
      </button>
      <button class="icon-btn ghost bell-btn-sm" id="bellBtn" title="Enable weather alerts">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9a5 5 0 0 1 10 0c0 4.2 1.6 5.4 1.6 5.4H5.4S7 13.2 7 9z"/><path d="M10.5 17.5c0 .9.7 1.5 1.5 1.5s1.5-.6 1.5-1.5"/></svg>
      </button>
      <div class="unit-toggle">
        <button id="unitC" class="active">°C</button>
        <button id="unitF">°F</button>
      </div>
    </div>
  </div>

  <div class="search">
    <div class="search-icon-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="cityInput" placeholder="Search city, area, or postal code…" autocomplete="off">
      <button class="icon-btn ghost voice-btn" id="voiceBtn" type="button" title="Use voice search" aria-label="Use voice search" aria-pressed="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg>
      </button>
      <div class="suggestions" id="suggestions" style="display:none;"></div>
    </div>
    <button class="icon-btn ghost" id="locBtn" title="Use my location">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <button class="icon-btn" id="searchBtn" title="Search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
    </button>
  </div>

  <div class="fav-row" id="favRow"></div>

  <div id="app">
    <div class="status">Loading Tirupati as a starting point…</div>
  </div>
</div>
<div class="toast-stack" id="toastStack"></div>

<script src="js/app.js?v=checkout2"></script>
</body>
</html>
